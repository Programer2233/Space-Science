<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Complete | Space Science Club</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/images/Gemini_Generated_Image_6vozdj6vozdj6voz.png">
  
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }
    
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 20px 60px;
      position: relative;
      z-index: 10;
    }
    
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 50px 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    
    .auth-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      background: rgba(6, 214, 160, 0.1);
      border: 1px solid rgba(6, 214, 160, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--accent-cyan);
    }
    
    .btn-submit.btn-cyan {
      background: var(--accent-cyan);
      color: #000;
      font-family: var(--font-mono);
      font-weight: 700;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 15px 30px;
      text-decoration: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  
  <canvas id="star-canvas"></canvas>

  <nav class="navbar scrolled" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">
          <img src="assets/images/Gemini_Generated_Image_6vozdj6vozdj6voz.png" alt="SSC">
        </span>
        Space Science
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
      </div>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">✓</div>
      
      <span class="section-eyebrow" style="justify-content: center; color: var(--accent-cyan);">Clearance Granted</span>
      
      <h1 class="section-title" style="margin-bottom: 15px; font-size: 2rem;">
        <span class="outline-text">Comm-Link</span>
        <span class="bold-text">Verified</span>
      </h1>
      
      <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 30px; line-height: 1.6;">
        Your identity has been confirmed and your account is now fully active. You are cleared to access mission control.
      </p>
      
      <a href="login.html" class="btn-submit btn-cyan">
        PROCEED TO LOGIN →
      </a>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0; justify-content: center;">
        <span>&copy; 2026 Space Science Club. Observing the Infinite.</span>
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
