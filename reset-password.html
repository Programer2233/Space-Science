<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Access Key | Space Science Club</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/images/Gemini_Generated_Image_6vozdj6vozdj6voz.png">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }
    
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 20px 60px;
      position: relative;
      z-index: 10;
    }
    
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 50px 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    
    .auth-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .auth-logo img {
      width: 60%;
      height: 60%;
      object-fit: contain;
    }
    
    .form-group {
      text-align: left;
      margin-bottom: 24px;
    }
    
    .terminal-label {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 8px;
    }
    
    .auth-error {
      display: none;
      background: rgba(255, 125, 255, 0.1);
      color: var(--accent-pink);
      padding: 15px;
      border-radius: var(--radius-md);
      margin-bottom: 25px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      border: 1px solid var(--accent-pink);
      text-align: left;
    }
    
    .auth-success {
      display: none;
      background: rgba(6, 214, 160, 0.1);
      color: var(--accent-cyan);
      padding: 15px;
      border-radius: var(--radius-md);
      margin-bottom: 25px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      border: 1px solid var(--accent-cyan);
      text-align: left;
    }
    
    .btn-submit.btn-cyan {
      background: var(--accent-cyan);
      color: #000;
      font-family: var(--font-mono);
      font-weight: 700;
      width: 100%;
    }
  </style>
</head>
<body>
  
  <canvas id="star-canvas"></canvas>

  <!-- ======== NAVIGATION ======== -->
  <nav class="navbar scrolled" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">
          <img src="assets/images/Gemini_Generated_Image_6vozdj6vozdj6voz.png" alt="SSC">
        </span>
        Space Science
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
      </div>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="assets/images/Gemini_Generated_Image_6vozdj6vozdj6voz.png" alt="SSC Logo">
      </div>
      
      <span class="section-eyebrow" style="justify-content: center;">Security Override</span>
      
      <h1 class="section-title" style="margin-bottom: 10px; font-size: 2rem;">
        <span class="outline-text">Reset</span>
        <span class="bold-text">Access Key</span>
      </h1>
      
      <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 30px;">
        Enter a new secure access key for your comm-link.
      </p>
      
      <div id="authError" class="auth-error"></div>
      <div id="authSuccess" class="auth-success"></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="password" class="terminal-label">New Access Key (6+ chars)</label>
          <input type="password" id="password" required minlength="6" placeholder="••••••••">
        </div>
        
        <div class="form-group">
          <label for="confirmPassword" class="terminal-label">Confirm Access Key</label>
          <input type="password" id="confirmPassword" required minlength="6" placeholder="••••••••">
        </div>

        <button type="submit" class="btn-submit btn-cyan" id="submitBtn">
          UPDATE ACCESS KEY 🔑
        </button>
      </form>
      
      <div style="margin-top: 20px; font-family: var(--font-body); font-size: 0.9rem;">
        <a href="login.html" style="color: var(--accent-blue); text-decoration: none;">← Back to Login</a>
      </div>
    </div>
  </main>

  <!-- ======== FOOTER ======== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0; justify-content: center;">
        <span>&copy; 2026 Space Science Club. Observing the Infinite.</span>
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const errorEl = document.getElementById('authError');
    const successEl = document.getElementById('authSuccess');
    const submitBtn = document.getElementById('submitBtn');

    // Make sure we have a session (Supabase automatically handles the hash in URL)
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await waitForSupabase();
        
        // Supabase client uses the #access_token in URL to establish a temporary session
        // Listen for auth state change
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
          if (event == "PASSWORD_RECOVERY") {
            console.log("Password recovery mode active");
          }
        });
      } catch (err) {
        console.error("Supabase init error:", err);
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = passwordInput.value;
      const confirm = confirmInput.value;
      
      if (password !== confirm) {
        errorEl.textContent = '✖ ERROR: Access keys do not match.';
        errorEl.style.display = 'block';
        return;
      }
      
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'UPDATING... ⏳';
      submitBtn.style.opacity = '0.7';
      
      try {
        await waitForSupabase();
        const { error } = await supabaseClient.auth.updateUser({ password: password });
        
        if (error) throw error;
        
        form.style.display = 'none';
        successEl.textContent = '✓ SUCCESS: Access key updated. You can now login.';
        successEl.style.display = 'block';
        
        // Automatically redirect to login after a few seconds
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 3000);
        
      } catch (err) {
        errorEl.textContent = '✖ ERROR: ' + (err.message || 'Failed to update access key. The link may have expired.');
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
        submitBtn.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
